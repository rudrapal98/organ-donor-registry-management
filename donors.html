<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donors | Organ Donor Registry</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="mainNav"></div>

  <main class="container page-section">
    <h1 class="page-title mb-4">Donor Registration</h1>

    <!-- Alert / validation message area -->
    <div id="donorAlert"></div>

    <!-- Registration form -->
    <div class="card mb-4">
      <div class="card-header">Donor Details</div>
      <div class="card-body">
        <form id="donorForm" novalidate>
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <label for="donorId" class="form-label">Donor ID</label>
              <input type="text" class="form-control" id="donorId" value="Auto Generated" readonly>
            </div>
            <div class="col-12 col-md-4">
              <label for="donorName" class="form-label required">Full Name</label>
              <input type="text" class="form-control" id="donorName" placeholder="e.g. Rahul Sharma">
            </div>
            <div class="col-12 col-md-4">
              <label for="donorAge" class="form-label required">Age</label>
              <input type="text" class="form-control" id="donorAge" placeholder="e.g. 32" inputmode="numeric">
            </div>
            <div class="col-12 col-md-4">
              <label for="donorGender" class="form-label required">Gender</label>
              <select class="form-select" id="donorGender"></select>
            </div>
            <div class="col-12 col-md-4">
              <label for="donorBloodGroup" class="form-label required">Blood Group</label>
              <select class="form-select" id="donorBloodGroup"></select>
            </div>
            <div class="col-12 col-md-4">
              <label for="donorPhone" class="form-label required">Phone Number</label>
              <input type="text" class="form-control" id="donorPhone" placeholder="e.g. 9876543210" inputmode="numeric">
            </div>
            <div class="col-12 col-md-4">
              <label for="donorOrgan" class="form-label required">Organ to Donate</label>
              <select class="form-select" id="donorOrgan"></select>
            </div>
            <div class="col-12 col-md-8">
              <label for="donorAddress" class="form-label required">Address</label>
              <input type="text" class="form-control" id="donorAddress" placeholder="e.g. 12 MG Road, Pune">
            </div>
            <div class="col-12">
              <label for="donorMedical" class="form-label">Medical Condition (Optional)</label>
              <textarea class="form-control" id="donorMedical" rows="2" placeholder="Any relevant medical history"></textarea>
            </div>
          </div>

          <div class="mt-3">
            <button type="submit" class="btn btn-primary" id="donorSubmitBtn">Save</button>
            <button type="reset" class="btn btn-outline-secondary">Reset</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Registered donors -->
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Registered Donors</span>
        <span class="badge bg-primary" id="donorCount">0</span>
      </div>
      <div class="card-body">
        <div id="donorEmpty" class="text-muted text-center py-3">
          No donors registered yet. Use the form above to add one.
        </div>
        <div class="table-wrapper">
          <table class="table table-striped table-bordered align-middle mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Blood Group</th>
                <th>Phone</th>
                <th>Organ</th>
                <th>Medical Condition</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="donorTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer py-3 mt-4">
    <div class="container text-center">
      Organ Donor Registry Management System &mdash; College Mini Project
    </div>
  </footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/common.js"></script>
  <script src="js/donor.js"></script>
</body>
</html>
