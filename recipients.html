<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recipients | Organ Donor Registry</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="mainNav"></div>

  <main class="container page-section">
    <h1 class="page-title mb-4">Recipient Registration</h1>

    <!-- Alert / validation message area -->
    <div id="recipientAlert"></div>

    <!-- Registration form -->
    <div class="card mb-4">
      <div class="card-header">Recipient Details</div>
      <div class="card-body">
        <form id="recipientForm" novalidate>
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <label for="recipientId" class="form-label">Recipient ID</label>
              <input type="text" class="form-control" id="recipientId" value="Auto Generated" readonly>
            </div>
            <div class="col-12 col-md-4">
              <label for="recipientName" class="form-label required">Full Name</label>
              <input type="text" class="form-control" id="recipientName" placeholder="e.g. Anjali Verma">
            </div>
            <div class="col-12 col-md-4">
              <label for="recipientAge" class="form-label required">Age</label>
              <input type="text" class="form-control" id="recipientAge" placeholder="e.g. 45" inputmode="numeric">
            </div>
            <div class="col-12 col-md-4">
              <label for="recipientGender" class="form-label required">Gender</label>
              <select class="form-select" id="recipientGender"></select>
            </div>
            <div class="col-12 col-md-4">
              <label for="recipientBloodGroup" class="form-label required">Blood Group</label>
              <select class="form-select" id="recipientBloodGroup"></select>
            </div>
            <div class="col-12 col-md-4">
              <label for="recipientOrgan" class="form-label required">Required Organ</label>
              <select class="form-select" id="recipientOrgan"></select>
            </div>
            <div class="col-12 col-md-8">
              <label for="recipientHospital" class="form-label required">Hospital Name</label>
              <input type="text" class="form-control" id="recipientHospital" placeholder="e.g. City General Hospital">
            </div>
          </div>

          <div class="mt-3">
            <button type="submit" class="btn btn-primary" id="recipientSubmitBtn">Save</button>
            <button type="reset" class="btn btn-outline-secondary">Reset</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Registered recipients -->
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Registered Recipients</span>
        <span class="badge bg-primary" id="recipientCount">0</span>
      </div>
      <div class="card-body">
        <div id="recipientEmpty" class="text-muted text-center py-3">
          No recipients registered yet. Use the form above to add one.
        </div>
        <div class="table-wrapper">
          <table class="table table-striped table-bordered align-middle mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Blood Group</th>
                <th>Required Organ</th>
                <th>Hospital</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="recipientTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer py-3 mt-4">
    <div class="container text-center">
      Organ Donor Registry Management System &mdash; College Mini Project
    </div>
  </footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/common.js"></script>
  <script src="js/recipient.js"></script>
</body>
</html>
