<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | Organ Donor Registry</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="css/bootstrap.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="mainNav"></div>

  <main class="container page-section">
    <h1 class="page-title mb-4">Search Donors</h1>

    <!-- Search form -->
    <div class="card mb-4">
      <div class="card-header">Search Criteria</div>
      <div class="card-body">
        <form id="searchForm">
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <label for="searchName" class="form-label">Name</label>
              <input type="text" class="form-control" id="searchName" placeholder="Search by name">
            </div>
            <div class="col-12 col-md-4">
              <label for="searchBloodGroup" class="form-label">Blood Group</label>
              <select class="form-select" id="searchBloodGroup"></select>
            </div>
            <div class="col-12 col-md-4">
              <label for="searchOrgan" class="form-label">Organ</label>
              <select class="form-select" id="searchOrgan"></select>
            </div>
          </div>
          <div class="mt-3">
            <button type="submit" class="btn btn-primary">Search</button>
            <button type="reset" class="btn btn-outline-secondary">Reset</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Results -->
    <div class="card">
      <div class="card-header d-flex justify-content-between align-items-center">
        <span>Matching Donors</span>
        <span class="text-muted small" id="searchSummary">0 donors found.</span>
      </div>
      <div class="card-body">
        <div id="searchEmpty" class="text-muted text-center py-3 d-none">
          No donors match your search.
        </div>
        <div class="table-wrapper">
          <table class="table table-striped table-bordered align-middle mb-0">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Gender</th>
                <th>Blood Group</th>
                <th>Organ</th>
                <th>Phone</th>
              </tr>
            </thead>
            <tbody id="searchTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer py-3 mt-4">
    <div class="container text-center">
      Organ Donor Registry Management System &mdash; College Mini Project
    </div>
  </footer>

  <script src="js/bootstrap.bundle.min.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/seed.js"></script>
  <script src="js/common.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
